<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- YouTube IFrame API requires a Referer header; suppress via strict-origin-when-cross-origin.
         Without this, YouTube throws Error 153 (embedder.identity.missing.referrer) inside
         Capacitor / Android WebViews where the default referrer policy strips the Referer. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Bye Bye Diabetes — Reverse Diabetes, Restore Life</title>
    <meta name="description" content="A science-backed metabolic correction system to reverse diabetes and restore your health.">
    <meta name="author" content="Gautam Guha" />
    <!-- Fonts are bundled locally via @fontsource (Manrope + Sora). A remote
         Google Fonts stylesheet here was render-blocking: on a cold start with a
         slow/offline network the WebView held the first paint (white screen) until
         the request resolved or timed out. Do not re-add a remote font <link>. -->

    <meta property="og:title" content="Bye Bye Diabetes">
    <meta property="og:type" content="website" />
    <meta property="og:description" content="A science-backed metabolic correction system to reverse diabetes and restore your health.">
    <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/2684b4bd-e83a-4671-8ec4-75cd9bff363b/id-preview-7a9a6244--c700f153-c318-4052-909f-7d8091bd7aed.lovable.app-1771486378777.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bye Bye Diabetes">
    <meta name="twitter:description" content="A science-backed metabolic correction system to reverse diabetes and restore your health.">
    <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/2684b4bd-e83a-4671-8ec4-75cd9bff363b/id-preview-7a9a6244--c700f153-c318-4052-909f-7d8091bd7aed.lovable.app-1771486378777.png">

    <!-- MSG91 OTP Widget: default 4-digit template and configured SMS channel. -->
    <script>
      var configuration = {
        widgetId: "356b71685561353436363635",
        tokenAuth: "478181TOAfR90F2N691ae1eeP1",
        exposeMethods: true,
        success: function () {},
        failure: function (error) { console.warn("MSG91 OTP failure", error); }
      };
      (function loadMsg91Widget(config, documentRef) {
        var attempts = 0;
        function load() {
          var script = documentRef.createElement("script");
          script.src = "https://verify.msg91.com/otp-provider.js";
          script.async = true;
          script.onload = function () {
            if (typeof window.initSendOTP === "function") window.initSendOTP(config);
          };
          script.onerror = function () {
            attempts += 1;
            if (attempts < 3) window.setTimeout(load, 750 * attempts);
          };
          documentRef.head.appendChild(script);
        }
        // Deferred: the OTP widget is only needed on the login screen. Loading it
        // during boot competed with the app bundle for the WebView's main thread.
        if (document.readyState === "complete") window.setTimeout(load, 1200);
        else window.addEventListener("load", function () { window.setTimeout(load, 1200); });
      })(configuration, document);
    </script>

    <style>
      /* Instant boot screen — painted from HTML before any JavaScript runs, so a
         cold start never shows a blank white WebView. Removed by main.tsx once
         React has mounted. */
      #bb-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        transition: opacity 260ms ease;
      }
      #bb-boot.bb-boot-hide { opacity: 0; pointer-events: none; }
      #bb-boot .bb-boot-mark {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 12px 32px -14px rgba(15, 26, 61, 0.18), 0 0 0 1px rgba(15, 26, 61, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #bb-boot .bb-boot-mark img { width: 68px; height: 68px; object-fit: contain; }
      #bb-boot .bb-boot-word {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #1a73e8;
      }
      #bb-boot .bb-boot-word span { color: #e63946; }
      #bb-boot .bb-boot-tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #687074;
      }
      #bb-boot .bb-boot-bar {
        width: 96px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(15, 26, 61, 0.08);
      }
      #bb-boot .bb-boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1a73e8, #e63946);
        animation: bb-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes bb-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>


  <body>
    <div id="root"></div>
    <div id="bb-boot">
      <div class="bb-boot-mark"><img src="/favicon.png" alt="" /></div>
      <div class="bb-boot-word"><span>BB</span>DO</div>
      <div class="bb-boot-bar"><i></i></div>
      <div class="bb-boot-tag">Start your reversal</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
